name: Promotion quality gates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_NAME: milkywayy_ci
  DB_USER: postgres
  DB_PASSWORD: postgres
  MW_TEST_POSTGRES_ADMIN_OPT_IN: CREATE_DROP_RESERVED_DATABASES
  MW_TEST_POSTGRES_ADMIN_HOST: 127.0.0.1
  MW_TEST_POSTGRES_ADMIN_PORT: 5432
  MW_TEST_POSTGRES_ADMIN_USER: postgres
  MW_TEST_POSTGRES_ADMIN_PASSWORD: postgres
  MW_TEST_POSTGRES_ADMIN_DATABASE: postgres
  JWT_SECRET: ci-test-only-jwt-signing-secret-not-for-production
  NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3000
  STRIPE_SECRET_KEY: sk_test_ci_not_a_real_stripe_key
  STRIPE_WEBHOOK_SECRET: whsec_ci_not_a_real_webhook_secret

jobs:
  promotion-coverage:
    name: Promotion coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:promotions:coverage
      - name: Verify deliberate threshold failure
        run: npm run test:promotions:quality-gate-proof
      - name: Upload safe coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  invoice-coverage:
    name: Invoice focused coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: timeout 8m npm run test:invoices:coverage
      - name: Verify deliberate threshold failure
        run: timeout 8m npm run test:invoices:quality-gate-proof
      - name: Upload safe coverage artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  invoice-pdf-smoke:
    name: Invoice real Chromium PDF smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: npm ci
      - name: Record Puppeteer Chromium version
        run: |
          node - <<'NODE'
          const puppeteer = require("puppeteer");
          console.log(`puppeteer=${require("puppeteer/package.json").version}`);
          console.log(`chromium_executable=${puppeteer.executablePath()}`);
          NODE
          npx puppeteer browsers list
      - run: timeout 5m npm run test:invoices:pdf

  promotion-postgres:
    name: PostgreSQL migration, integration, and invoice numbering gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record PostgreSQL version
        run: PGPASSWORD="$DB_PASSWORD" psql --host="$DB_HOST" --username="$DB_USER" --dbname=postgres --command='SHOW server_version;'
      - run: timeout 12m npm run test:promotions:postgres
      - run: timeout 12m npm run test:invoices:postgres
      - name: Clean disposable PostgreSQL databases
        if: always()
        run: npm run cleanup:disposable-postgres
      - name: Upload safe PostgreSQL test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-postgres-${{ github.run_id }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  repository-jest-baseline:
    name: Repository-wide Jest baseline (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run full Jest suite and retain its known unrelated baseline separately
        continue-on-error: true
        run: timeout 18m npm run test:jest:full
      - name: Clean disposable PostgreSQL databases
        if: always()
        run: npm run cleanup:disposable-postgres
